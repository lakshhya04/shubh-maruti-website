             C520 696,530 710,532 725
             C535 744,548 760,556 775
             C565 760,573 742,570 725
             C568 710,575 695,565 682
             C555 668,540 655,520 650 Z"/>
    <!-- Europe -->
    <path d="M605 575
             C620 565,640 570,650 582
             C658 590,670 586,680 595
             C685 605,675 612,665 610
             C655 606,645 610,638 620
             C630 628,620 625,615 615
             C610 604,600 590,605 575 Z"/>
    <!-- Africa -->
    <path d="M615 625
